name: Deploy client to GitHub Pages

# Deploys ONLY the Vite client build. The Express server and SQLite
# database are backend components and are NOT deployed to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client (Vite production build)
        working-directory: client
        run: npm run build

      # SPA fallback: GitHub Pages has no server-side routing, so deep
      # links like /dashboard, /campaigns, /login, /settings return 404.
      # Serving a copy of index.html as 404.html lets the React Router
      # pick up the real URL and render the correct route.
      - name: Create SPA fallback (404.html)
        run: cp client/dist/index.html client/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
